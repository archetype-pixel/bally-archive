name: Process new files (always-on watcher)

# One run watches for ~5h20m, checking every 2 minutes for new uploads, intake files and missing
# AI descriptions, fingerprints, tags or zoom images; then it starts the next run itself.
# The schedule below is only a backstop that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: https://glfiqywdzqcnrhpsjwwp.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: wrkspc_01XqRumCyjrtr4FBbThq4igk
      MODEL: claude-haiku-5-5
      TEXT_MODEL: claude-sonnet-5-5
      GH_TOKEN: ${{ github.token }}
      LOOP_SECONDS: "19200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 Pillow==11.2.1 pillow-heif rawpy defusedxml anthropic open_clip_torch==2.26.1 torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Pre-load the image model
        run: python -c "import open_clip; open_clip.create_model_and_transforms('ViT-B-32', pretrained='openai'); open_clip.create_model_and_transforms('ViT-B-32', pretrained='laion2b_s34b_b79k')"
      - name: Watch and process
        run: bash migrate/enrich_loop.sh
      - name: Restart the chain if the watcher failed (after a 10 minute pause)
        if: failure()
        run: |
          sleep 600
          gh workflow run enrich.yml -R "$GITHUB_REPOSITORY" || true
