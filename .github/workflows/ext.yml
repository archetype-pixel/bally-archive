name: External sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: "commons | collect | auction | registry | video | fiximages | verify | load | embed | links"
        default: "commons"
      sources:
        description: "collect: comma list of plugins (blank = default); auction: comma list of houses"
        default: ""

concurrency:
  group: ext
  cancel-in-progress: false

env:
  SUPABASE_URL: https://glfiqywdzqcnrhpsjwwp.supabase.co
  ANTHROPIC_WORKSPACE_ID: wrkspc_01XqRumCyjrtr4FBbThq4igk

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: library-data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 Pillow==11.2.1 anthropic pymupdf==1.24.10
      - if: inputs.source == 'embed'
        run: pip install open_clip_torch==2.26.1 torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA: data/external
          SOURCE: ${{ inputs.source }}
          SOURCES: ${{ inputs.sources }}
          HOUSES: ${{ inputs.sources }}
        run: |
          case "$SOURCE" in
            commons) python migrate/ext_commons.py ;;
            collect) python migrate/ext_collect.py ;;
            auction) python migrate/ext_auction.py ;;
            registry) python migrate/ext_registry.py ;;
            video) python migrate/ext_video.py ;;
            fiximages) python migrate/ext_fiximages.py ;;
            verify) python migrate/ext_verify.py ;;
            load) python migrate/ext_load.py ;;
            embed) python migrate/ext_embed.py ;;
            links) MODE=links LINK_SET=ext MODEL=claude-opus-5-5 WORKERS=6 python migrate/library_ai.py ;;
          esac
