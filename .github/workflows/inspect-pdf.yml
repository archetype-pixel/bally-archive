name: Inspect archive PDFs (title pages)

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated storage paths in the archive bucket"
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Download and print first pages
        env:
          SB: https://glfiqywdzqcnrhpsjwwp.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PATHS: ${{ inputs.paths }}
        run: |
          for p in $PATHS; do
            echo "=================== $p"
            curl -sf -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$SB/storage/v1/object/archive/$p" -o f.pdf || { echo "download failed"; continue; }
            pdfinfo f.pdf | grep -E "Pages|Title|Author|CreationDate|Producer" || true
            echo "--- page 1-3 text:"
            pdftotext -f 1 -l 3 -layout f.pdf - | sed '/^\s*$/d' | head -60
          done
