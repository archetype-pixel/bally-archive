name: PDF cover pictures, then rebuild catalogue bundle

on:
  workflow_dispatch:

env:
  SUPABASE_URL: https://glfiqywdzqcnrhpsjwwp.supabase.co

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null && pip install requests==2.32.3 Pillow==11.2.1
      - name: Render page 1 of every catalogued PDF
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python migrate/pdf_thumbs.py
