name: Look inside stored files that have no catalogue record

on:
  workflow_dispatch:

env:
  SUPABASE_URL: https://glfiqywdzqcnrhpsjwwp.supabase.co

jobs:
  orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-tools poppler-utils ffmpeg >/dev/null && pip install requests==2.32.3
      - env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python migrate/orphan_files.py
